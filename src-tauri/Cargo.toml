[[bin]]
name = "Decentraland-Launcher"
path = "src/main.rs"

[package]
name = "Decentraland-Launcher"
version = "1.22.2"
description = "Decentraland Launcher App"
authors = [ "Decentraland",]
edition = "2021"
default-run = "Decentraland-Launcher"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib",]

[dependencies]
deranged = "=0.4.0"
plist = "=1.7.0"
anyhow = "1.0.97"
serde_json = "1.0.140"
log = "0.4"
fern = "0.7.1"
humantime = "2.2.0"
sentry = { version = "0.37.0", features = ["anyhow", "log", "reqwest", "rustls", "backtrace"] }
tokio = { version = "1.44.1", features = ["time", "rt"] }
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"

[dev-dependencies]
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies.dcl-launcher-ipc]
path = "../src-ipc"

[dependencies.dcl-launcher-shared]
path = "../src-shared"

[dependencies.tauri]
version = "2"
features = []

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
